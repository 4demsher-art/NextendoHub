# XcodeGen project definition.  brew install xcodegen  &&  xcodegen generate
name: NextendoHub
options:
  bundleIdPrefix: network.nextendo
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "7"
    DEVELOPMENT_TEAM: ""            # <-- your 10-char Apple Team ID
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.9"

targets:
  NextendoHub:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - Sources
      - path: www
        type: folder            # copied verbatim into the bundle as a blue folder
      - Resources/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: network.nextendo.hub
        INFOPLIST_FILE: Info.plist
        CODE_SIGN_ENTITLEMENTS: NextendoHub.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    # No `info:` block on purpose: that makes XcodeGen *regenerate* Info.plist
    # from its own defaults on every `xcodegen generate`, discarding the
    # hand-authored keys (ATS exceptions, full-screen / status-bar, launch
    # screen, orientations). INFOPLIST_FILE above points Xcode at the real
    # file as-is.
