name: Build NRO

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
    paths-ignore:
      - "**.md"
  pull_request:
    paths-ignore:
      - "**.md"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    # Official devkitPro image: has devkitA64 + libnx preinstalled, DEVKITPRO
    # env var already set, dkp-pacman wired up for the switch-* portlibs.
    container:
      image: devkitpro/devkita64:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # actions/checkout runs as a different uid than the container's root
      # inside GitHub's runner; without this, git refuses to touch the repo
      # ("detected dubious ownership") when setup.sh shells out to git.
      - name: Trust the checkout dir
        run: git config --global --add safe.directory '*'

      # pkg.devkitpro.org sits behind Cloudflare and intermittently 403s
      # requests from GitHub-hosted runners' shared IP ranges — a known
      # flakiness, not a config problem. Retry with backoff instead of
      # failing the whole job on the first hiccup.
      - name: Install Switch portlibs
        shell: bash
        run: |
          set -u
          PKGS="switch-dev switch-curl switch-mbedtls switch-zlib switch-glfw switch-mesa switch-libdrm_nouveau"
          ok=0
          for i in $(seq 1 8); do
            # -Sy can 403 on the .db files; if it does, keep going and let the
            # per-package installs (which --needed makes idempotent) accumulate
            # whatever got through.
            dkp-pacman -Sy --noconfirm || true
            miss=0
            for p in $PKGS; do
              dkp-pacman -S --noconfirm --needed "$p" || miss=1
            done
            if [ "$miss" = 0 ]; then ok=1; break; fi
            w=$(( i * 20 + RANDOM % 20 ))
            echo "portlibs still incomplete (attempt $i/8) — retrying in ${w}s"
            sleep "$w"
          done
          if [ "$ok" != 1 ]; then
            echo "::error::could not install devkitPro portlibs after 8 attempts (pkg.devkitpro.org behind Cloudflare keeps 403-ing this runner)"
            exit 1
          fi
          dkp-pacman -Q | grep -E 'switch-(curl|mbedtls|glfw|mesa|zlib)' || true

      # Cache the cloned borealis checkout (pinned commit, see setup.sh) so
      # reruns don't re-clone+build it from scratch every time.
      - name: Cache borealis checkout
        uses: actions/cache@v4
        with:
          path: lib/borealis
          key: borealis-${{ hashFiles('setup.sh') }}

      - name: Fetch borealis + stage resources
        run: |
          chmod +x setup.sh
          ./setup.sh

      - name: Build NextendoHub.nro
        run: make -j$(nproc)

      - name: Verify build output
        run: |
          test -f NextendoHub.nro
          ls -la NextendoHub.nro NextendoHub.elf NextendoHub.nacp

      - name: Upload NRO artifact
        uses: actions/upload-artifact@v4
        with:
          name: NextendoHub-nro
          path: |
            NextendoHub.nro
            NextendoHub.elf
            NextendoHub.nacp
          if-no-files-found: error
          retention-days: 30

  # On a tag push (e.g. `v1.0.0`), also attach the .nro to a GitHub Release.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download built NRO
        uses: actions/download-artifact@v4
        with:
          name: NextendoHub-nro
          path: dist

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/NextendoHub.nro
