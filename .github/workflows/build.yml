name: Build NextendoHub NRO

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Switch development packages
        shell: bash
        run: |
          if command -v dkp-pacman >/dev/null 2>&1; then
            dkp-pacman -Syu --noconfirm
            dkp-pacman -S --needed --noconfirm switch-dev switch-curl switch-zlib switch-mbedtls
          elif command -v pacman >/dev/null 2>&1; then
            pacman -Sy --noconfirm
            pacman -S --needed --noconfirm switch-dev switch-curl switch-zlib switch-mbedtls
          else
            echo "No devkitPro pacman found; using packages already in devkita64 image."
          fi

      - name: Prepare Borealis
        shell: bash
        run: |
          chmod +x setup.sh
          ./setup.sh

      - name: Verify dependencies
        shell: bash
        run: |
          echo "==> borealis.hpp"
          find lib/borealis -type f -name borealis.hpp -print
          echo "==> libretro-common features_cpu.h"
          find lib/borealis -type f -path '*/libretro-common/features/features_cpu.h' -print
          echo "==> switch.h"
          find "$DEVKITPRO" -type f -name switch.h -print | head -20

      - name: Build NRO
        shell: bash
        run: |
          export DEVKITPRO=/opt/devkitpro
          export DEVKITA64=/opt/devkitpro/devkitA64
          export PATH="$DEVKITPRO/tools/bin:$DEVKITA64/bin:$PATH"
          export BOREALIS_RESOURCES="romfs:/"
          make clean || true
          make -j2
          test -f NextendoHub.nro
          ls -lh NextendoHub.nro

      - name: Upload NRO
        uses: actions/upload-artifact@v4
        with:
          name: NextendoHub-NRO
          path: NextendoHub.nro
          if-no-files-found: error
