name: Build NextendoHub NRO

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Borealis
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE"
          chmod +x setup.sh
          ./setup.sh

      - name: Build NRO
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE"

          export DEVKITPRO=/opt/devkitpro
          export DEVKITA64=/opt/devkitpro/devkitA64
          export PATH="$DEVKITPRO/tools/bin:$DEVKITA64/bin:$PATH"
          export BOREALIS_RESOURCES="romfs:/"

          echo "=== BUILD DIRECTORY ==="
          pwd
          echo "=== PROJECT FILES ==="
          ls -la
          echo "=== MAKEFILE ==="
          test -f Makefile

          make clean || true
          make -j2

          test -f NextendoHub.nro
          ls -lh NextendoHub.nro

      - name: Upload NRO
        uses: actions/upload-artifact@v4
        with:
          name: NextendoHub-NRO
          path: NextendoHub.nro
          if-no-files-found: error
